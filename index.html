<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СтройРасчёт</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#20242b;--muted:#737b87;--line:#e7e9ee;--blue:#2864dc;--soft:#edf3ff;--green:#16845b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:25px 15px}.brand{font-size:19px;font-weight:800;padding:8px 12px 30px}.brand b{background:var(--blue);color:white;border-radius:10px;padding:7px 11px;margin-right:8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;color:#59616d;cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:var(--blue)}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;justify-content:space-between}.content{max-width:1150px;margin:auto;padding:32px}.head{margin-bottom:22px}.eyebrow{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:1px}.head h1{font-size:28px;margin:4px 0}.muted{color:var(--muted)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;min-width:0}.stat{font-size:25px;font-weight:800;margin-top:5px}.two{grid-template-columns:1.2fr 1fr}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px;text-align:left;cursor:pointer}.quick button:hover{border-color:#9db8ef}.quick strong{display:block;margin:5px 0}.small{font-size:12px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;cursor:pointer}.primary{background:var(--blue);color:white;border-color:var(--blue)}.result{background:#f5f8fc;padding:15px;border-radius:10px;margin-top:15px}.result strong{display:block;color:var(--green);font-size:27px}.formula{background:#f4f5f7;padding:12px;border-radius:8px;font-family:monospace;margin:12px 0}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}.tabs button{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:18px;cursor:pointer}.tabs button.active{background:var(--soft);color:var(--blue)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:10px}th{color:var(--muted)}.right{text-align:right}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.note{font-size:11px;color:var(--muted);margin-top:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{padding:10px;position:static}.brand{padding:8px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:12px;padding:8px}.content{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{padding:0 18px}}@media(max-width:520px){.quick{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.head h1{font-size:24px}}@media print{.side,.top,.no-print{display:none!important}.content{padding:0}.card{box-shadow:none}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><b>С</b>СтройРасчёт</div><nav class="nav"><button class="active" data-page="home">⌂ Главная</button><button data-page="calc">▦ Калькуляторы</button><button data-page="formulas">ƒ Формулы</button><button data-page="estimates">▤ Сметы и счета</button><button data-page="projects">▣ Мои проекты</button></nav><p class="note">Первая версия · локальное хранение</p></aside><main class="main"><header class="top"><span id="crumb">Рабочее пространство / Главная</span><span class="muted small">Веб-приложение</span></header><div class="content" id="view"></div></main></div>
<script>
const $=s=>document.querySelector(s),db={get(k){try{return JSON.parse(localStorage.getItem("sr_"+k)||"[]")}catch(e){return[]}},set(k,v){localStorage.setItem("sr_"+k,JSON.stringify(v))}};
let projects=db.get("projects"),estimates=db.get("estimates"),active="concrete",last=null;
const calcs=[
{id:"concrete",group:"Фундамент",name:"Объём бетона",desc:"Объём прямоугольной конструкции",fields:[["l","Длина, м",10],["w","Ширина, м",.4],["h","Высота, м",.8]],formula:"V = L × B × H",unit:"м³",fn:v=>v.l*v.w*v.h,explain:"Умножьте длину, ширину и высоту. Для сложного фундамента разделите его на простые участки и сложите объёмы."},
{id:"wall",group:"Стены",name:"Площадь стен",desc:"За вычетом окон и дверей",fields:[["l","Длина стены, м",8],["h","Высота, м",3],["o","Площадь проёмов, м²",2]],formula:"S = (L × H) − Sпроёмов",unit:"м²",fn:v=>Math.max(0,v.l*v.h-v.o),explain:"Площадь стены за вычетом суммарной площади оконных и дверных проёмов."},
{id:"blocks",group:"Стены",name:"Количество блоков",desc:"Оценка блоков для стены",fields:[["l","Длина стены, м",10],["h","Высота стены, м",3],["bl","Длина блока, м",.6],["bh","Высота блока, м",.2],["o","Площадь проёмов, м²",2]],formula:"N = S стены ÷ S блока",unit:"шт.",fn:v=>Math.ceil(Math.max(0,v.l*v.h-v.o)/(v.bl*v.bh)),explain:"Площадь стены делится на площадь лицевой стороны блока. Швы и подрезка здесь не учитываются."},
{id:"plaster",group:"Отделка",name:"Расход штукатурки",desc:"По площади и толщине слоя",fields:[["a","Площадь, м²",45],["r","Расход на 1 м² при 1 мм, кг",1.5],["t","Толщина слоя, мм",10]],formula:"M = S × r × t",unit:"кг",fn:v=>v.a*v.r*v.t,explain:"Площадь умножается на паспортный расход смеси при толщине 1 мм и на толщину слоя."},
{id:"floor",group:"Отделка",name:"Площадь пола",desc:"Прямоугольное помещение",fields:[["l","Длина, м",6],["w","Ширина, м",4]],formula:"S = L × B",unit:"м²",fn:v=>v.l*v.w,explain:"Для помещения сложной формы разделите план на прямоугольники и сложите их площади."},
{id:"roof",group:"Кровля",name:"Площадь ската крыши",desc:"Один прямоугольный скат",fields:[["l","Длина ската, м",8],["d","Длина по скату, м",5]],formula:"S = L × D",unit:"м²",fn:v=>v.l*v.d,explain:"Используйте длину по наклонной поверхности, а не горизонтальную проекцию."},
{id:"insulation",group:"Фасад",name:"Утеплитель в упаковках",desc:"Округление количества упаковок вверх",fields:[["a","Площадь, м²",120],["p","Площадь упаковки, м²",5.76]],formula:"N = S ÷ Sупаковки",unit:"уп.",fn:v=>Math.ceil(v.a/v.p),explain:"Площадь утепления разделите на площадь покрытия одной упаковки."}
];
const fmt=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:3}).format(n),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function head(k,t,d,action=""){return '<div class="row head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+d+'</p></div>'+action+'</div>'}
function go(p){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#crumb").textContent="Рабочее пространство / "+({home:"Главная",calc:"Калькуляторы",formulas:"Формулы",estimates:"Сметы и счета",projects:"Мои проекты"}[p]);({home:home,calc:calcPage,formulas:formulaPage,estimates:estimatePage,projects:projectPage}[p])()}
function home(){let total=estimates.reduce((s,e)=>s+e.items.reduce((a,i)=>a+i.q*i.p,0),0);$("#view").innerHTML=head("ОБЗОР","Строительные расчёты","Инструменты для предварительных расчётов, формул и смет.")+'<div class="grid stats"><div class="card"><span class="muted small">Проекты</span><div class="stat">'+projects.length+'</div></div><div class="card"><span class="muted small">Сметы</span><div class="stat">'+estimates.length+'</div></div><div class="card"><span class="muted small">Калькуляторы</span><div class="stat">'+calcs.length+'</div></div><div class="card"><span class="muted small">Сумма смет</span><div class="stat">'+fmt(total)+' ₽</div></div></div><div class="grid two"><section class="card"><h3>Популярные калькуляторы</h3><div class="quick">'+calcs.slice(0,6).map(c=>'<button data-calc="'+c.id+'"><strong>'+c.name+'</strong><span class="muted small">'+c.group+'</span></button>').join("")+'</div></section><section class="card"><h3>Последние проекты</h3>'+(projects.length?projects.slice(-4).reverse().map(p=>'<p><b>'+esc(p.name)+'</b><br><span class="muted small">'+esc(p.note)+'</span></p>').join(""):'<div class="empty">Проектов пока нет</div>')+'</section></div><p class="note">Предварительные расчёты не заменяют рабочую документацию и инженерную проверку.</p>'}
function calcPage(){let c=calcs.find(x=>x.id===active)||calcs[0];$("#view").innerHTML=head("ИНСТРУМЕНТЫ","Калькуляторы","Выберите расчёт и введите исходные размеры.")+'<div class="tabs">'+calcs.map(x=>'<button data-pick="'+x.id+'" class="'+(x.id===c.id?'active':'')+'">'+x.name+'</button>').join("")+'</div><div class="grid two"><section class="card"><div class="eyebrow">'+c.group+'</div><h2>'+c.name+'</h2><p class="muted small">'+c.desc+'</p><div class="fields">'+c.fields.map(f=>'<div class="field"><label>'+f[1]+'</label><input type="number" min="0" step="any" id="v_'+f[0]+'" value="'+f[2]+'"></div>').join("")+'</div><div class="actions"><button class="btn primary" id="run">Рассчитать</button><button class="btn" id="add">В смету</button></div><div class="result"><span class="muted small">РЕЗУЛЬТАТ</span><strong id="answer">—</strong><span class="muted small" id="meta"></span></div></section><section class="card"><h3>Как считается</h3><div class="formula">'+c.formula+'</div><p>'+c.explain+'</p><p class="note">Проверяйте единицы измерения и фактическую геометрию. Расчёт не учитывает автоматически технологические потери, если они не указаны отдельно.</p></section></div>';const run=()=>{let v={};for(let f of c.fields){let n=Number($("#v_"+f[0]).value);if(!Number.isFinite(n)||n<0){$("#answer").textContent="Проверьте ввод";return}v[f[0]]=n}let q=c.fn(v);last={name:c.name,q,unit:c.unit,formula:c.formula};$("#answer").textContent=fmt(q)+" "+c.unit;$("#meta").textContent="Формула: "+c.formula};$("#run").onclick=run;run();$("#add").onclick=()=>{if(!last)run();if(!last)return;let e=estimates[0];if(!e){e={id:Date.now(),name:"Новая смета",items:[]};estimates.unshift(e)}e.items.push({name:last.name,q:last.q,u:last.unit,p:0});db.set("estimates",estimates);go("estimates")};document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{active=b.dataset.pick;calcPage()})}
function formulaPage(){$("#view").innerHTML=head("СПРАВОЧНИК","Формулы","Краткое объяснение каждого строительного расчёта.")+'<div class="grid two">'+calcs.map(c=>'<article class="card"><div class="eyebrow">'+c.group+'</div><h3>'+c.name+'</h3><div class="formula">'+c.formula+'</div><p class="muted small">'+c.explain+'</p></article>').join("")+'</div>'}
function estimatePage(){$("#view").innerHTML=head("ДОКУМЕНТЫ","Сметы и счета","Добавляйте работы и материалы, задавайте цену и печатайте итог.",'<button id="newEst" class="btn primary">＋ Новая смета</button>')+(estimates.length?estimates.map(e=>'<section class="card" style="margin-bottom:15px"><div class="row"><div><h3>'+esc(e.name)+'</h3><span class="muted small">'+e.items.length+' позиций</span></div><div class="actions no-print"><button class="btn" data-item="'+e.id+'">＋ Позиция</button><button class="btn" data-print="'+e.id+'">PDF / Печать</button></div></div><table><thead><tr><th>Наименование</th><th>Кол-во</th><th>Ед.</th><th>Цена</th><th class="right">Сумма</th></tr></thead><tbody>'+e.items.map((i,n)=>'<tr><td>'+esc(i.name)+'</td><td>'+fmt(i.q)+'</td><td>'+esc(i.u)+'</td><td>'+fmt(i.p)+' ₽</td><td class="right">'+fmt(i.q*i.p)+' ₽ <button class="btn no-print" data-del="'+e.id+':'+n+'">×</button></td></tr>').join("")+'</tbody></table><h2 class="right">Итого: '+fmt(e.items.reduce((s,i)=>s+i.q*i.p,0))+' ₽</h2></section>').join(""):'<div class="empty">Смет пока нет. Создайте первую смету или добавьте расчёт из калькулятора.</div>');$("#newEst").onclick=()=>{let n=prompt("Название сметы","Смета "+(estimates.length+1));if(n){estimates.unshift({id:Date.now(),name:n,items:[]});saveE();estimatePage()}};document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{let e=estimates.find(x=>x.id==b.dataset.item),n=prompt("Наименование позиции");if(!n)return;let q=Number(prompt("Количество","1")),u=prompt("Единица","шт."),p=Number(prompt("Цена за единицу, ₽","0"));if(q>=0&&p>=0&&Number.isFinite(q)&&Number.isFinite(p)){e.items.push({name:n,q,u:u||"шт.",p});saveE();estimatePage()}});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{let [id,n]=b.dataset.del.split(":");estimates.find(x=>x.id==id).items.splice(Number(n),1);saveE();estimatePage()});document.querySelectorAll("[data-print]").forEach(b=>b.onclick=()=>printE(estimates.find(x=>x.id==b.dataset.print)))}
function saveE(){db.set("estimates",estimates)}
function printE(e){let rows=e.items.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+fmt(i.q)+' '+esc(i.u)+'</td><td>'+fmt(i.p)+' ₽</td><td>'+fmt(i.q*i.p)+' ₽</td></tr>').join(""),total=e.items.reduce((s,i)=>s+i.q*i.p,0),w=window.open("","_blank");if(!w){alert("Разрешите всплывающие окна для печати.");return}w.document.write('<html lang="ru"><meta charset="utf-8"><title>'+esc(e.name)+'</title><style>body{font:14px Arial;padding:35px}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;font-size:22px;margin-top:25px}</style><h1>'+esc(e.name)+'</h1><p>Предварительная смета · '+new Date().toLocaleDateString("ru-RU")+'</p><table><tr><th>Позиция</th><th>Количество</th><th>Цена</th><th>Сумма</th></tr>'+rows+'</table><div class="total">Итого: '+fmt(total)+' ₽</div><p>Документ требует согласования с заказчиком.</p><script>window.onload=()=>window.print()<\/script></html>');w.document.close()}
function projectPage(){$("#view").innerHTML=head("ОБЪЕКТЫ","Мои проекты","Сохраняйте строительные объекты и краткие заметки.",'<button id="newProject" class="btn primary">＋ Новый проект</button>')+(projects.length?'<div class="grid two">'+projects.map(p=>'<article class="card"><div class="eyebrow">ОБЪЕКТ</div><h3>'+esc(p.name)+'</h3><p class="muted small">'+esc(p.note)+'</p><button class="btn no-print" data-rm="'+p.id+'">Удалить</button></article>').join("")+'</div>':'<div class="empty">Проектов пока нет.</div>');$("#newProject").onclick=()=>{let n=prompt("Название объекта");if(!n)return;projects.push({id:Date.now(),name:n,note:prompt("Адрес или описание","")||""});db.set("projects",projects);projectPage()};document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{projects=projects.filter(p=>p.id!=b.dataset.rm);db.set("projects",projects);projectPage()})}
document.addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)go(b.dataset.page);let c=e.target.closest("[data-calc]");if(c){active=c.dataset.calc;go("calc")}});
go("home");
</script></body></html>
